<title>Abadi — not here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Martian+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
  :root { --ink: #14203A; --ink-line: #2A3B5E; --cotton: #EAE4D6; --cotton-dim: #8D97AE; --turmeric: #E0A045; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ink); color: var(--cotton); font-family: "Bricolage Grotesque", system-ui, sans-serif; padding: 24px; }
  main { max-width: 34ch; }
  .code { font-family: "Martian Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--cotton-dim); margin: 0 0 18px; }
  h1 { font-size: clamp(30px, 6vw, 48px); font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 0 0 16px; }
  h1 em { font-style: normal; color: var(--turmeric); }
  p { color: var(--cotton-dim); font-family: "Public Sans", system-ui, sans-serif; line-height: 1.6; margin: 0 0 26px; }
  a { color: var(--cotton); font-family: "Martian Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--ink-line); padding: 12px 16px; display: inline-block; margin: 0 8px 8px 0; }
  a:hover, a:focus-visible { border-color: var(--turmeric); color: var(--turmeric); outline: none; }
</style>

<main>
  <p class="code">404 · no such window</p>
  <h1>This market expired. <em>The others didn't.</em></h1>
  <p>Nothing lives at this address. Everything that does is one of these.</p>
  <a href="/">Landing</a>
  <a href="/dashboard">The working</a>
  <a href="/deck">Deck</a>
</main>
