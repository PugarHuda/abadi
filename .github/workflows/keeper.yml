name: keeper

# The bot, run by GitHub on a schedule. One cycle every fifteen minutes: settle what
# resolved, finalize what expired, flatten what is dead, quote what is idle, and arm the
# chain to wake the vault at that window's expiry. The wake-up is what makes a fifteen
# minute cadence enough — the chain closes positions between runs.
#
# Needs one repository secret: OPERATOR_PRIVATE_KEY. That key can steer quotes and
# nothing else; custody lives in the vault. ALERT_WEBHOOK is optional — without it the
# bot alerts to the log and the job's ::error:: annotations only.
#
# This job is green when a cycle had nothing to do and red when it hit a real error or
# found capital it could not free. It used to be green either way, including for the two
# days a slot sat frozen behind a dead oracle.
on:
  schedule:
    # Off the :00/:15/:30/:45 marks, which GitHub's scheduler drops under load. Nine
    # hours after this file landed, zero scheduled runs had fired for any workflow in
    # the repository; a local Task Scheduler entry (scripts/keeper.cmd) covers the gap.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    if: github.repository == 'PugarHuda/abadi'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: One cycle
        env:
          # Straight into the process. The previous version wrote this key to a .env file
          # in the workspace, where anything else in the job could read it and any later
          # step that archived the directory would have carried it out with it.
          PRIVATE_KEY: ${{ secrets.OPERATOR_PRIVATE_KEY }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            # This used to exit 0 and print a warning, so a keeper that had never run a
            # single cycle looked exactly like one that ran and found nothing to do.
            echo "::error::OPERATOR_PRIVATE_KEY is not set; this keeper cannot run a cycle"
            exit 1
          fi
          set -o pipefail
          CYCLES=1 SHORTEST=1 node scripts/bot.ts 2>&1 | tee keeper.log
      - name: Keep the log
        # Always, including on the failing runs, which are the ones worth reading. The
        # GitHub half of the keeper wrote nothing durable at all before this: ten fired
        # runs out of roughly 156 scheduled, and no record of what any of them did.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keeper-${{ github.run_id }}-${{ github.run_attempt }}
          path: keeper.log
          retention-days: 90
