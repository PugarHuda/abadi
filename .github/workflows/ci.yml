name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Everything here runs without network access to Somnia. The scripts that touch the
# live chain are deliberately excluded: a testnet outage is not a reason to fail a
# build, and the indexer drops roughly one call in five.
jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm deps
        # remappings.txt points at node_modules for OpenZeppelin and the Somnia
        # reactivity base, so `forge build` needs them. Without this the contracts job
        # cannot compile at all, and it had not compiled here since those remappings
        # were added.
        run: npm ci

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Install a16z's ERC-4626 property tests
        # Third-party conformance: the standard's requirements as fuzzed properties,
        # written by somebody who has never seen this vault. `/lib/` is gitignored, so
        # this has to be installed here the same way forge-std is.
        run: forge install a16z/erc4626-tests --no-git

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Coverage floor
        # via_ir needs --ir-minimum here. The fork suite is excluded: it skips without a
        # network and would count as uncovered. The floor is what the suite measured the
        # day it was added; it may go up, and a change that drops it fails the build.
        run: |
          forge coverage --ir-minimum --report summary --no-match-path "test/fork/*" | tee coverage.txt
          pct=$(grep -E '^\| Total' coverage.txt | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d %)
          echo "line coverage: $pct%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 85) { print "::error::line coverage " p "% is under the 85% floor"; exit 1 } }'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static analysis
        run: |
          pip install --quiet slither-analyzer
          # Triage and the reasons each accepted finding stands: docs/SLITHER.md
          slither . --filter-paths "lib|node_modules|test|script"             --exclude-informational --exclude-low             --exclude divide-before-multiply,unused-return,reentrancy-benign,reentrancy-events             --fail-high

      - name: Every stated test count must be the real one
        # Twice in one day the README quoted a test count that no longer existed. The
        # same class of drift put a dead vault address on the front page. If a number is
        # going to be asserted in prose, something has to check it.
        run: |
          n=$(forge test 2>&1 | grep -oE '[0-9]+ tests passed' | tail -1 | cut -d' ' -f1)
          echo "forge reports $n"
          bad=0
          for f in README.md app/deck/page.tsx; do
            for m in $(grep -oE '[0-9]+ tests' "$f" | cut -d' ' -f1 | sort -u); do
              if [ "$m" != "$n" ]; then
                echo "::error::$f says $m tests, forge says $n"
                bad=1
              fi
            done
          done
          exit $bad

      - name: The published ABI must be the compiled one
        # public/abi.json is served at /abi.json for other projects to call this vault with.
        # It is committed, because Vercel builds the site with no Foundry and generating it
        # there took production down. Committed means it can go stale, so it is gated here
        # where the compiler exists rather than trusted.
        run: node scripts/abi.mjs --check

      - name: Fail on any remaining TODO in contracts
        run: |
          if grep -rnE "TODO|FIXME|XXX" src/ ; then
            echo "::error::unresolved marker in src/"
            exit 1
          fi
          echo "none"

  web:
    name: web + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: The address in the prose must be the address in .vault-addr
        # The live address on the front page was a build older than the source for a
        # whole day, and the only reason anyone noticed is that a value path finally
        # reverted. `.vault-addr` is the one place the address lives; everything that
        # quotes it has to agree. (Whether that address is running THIS source needs the
        # chain, so it is `node scripts/attest.ts` and not a CI step.)
        run: |
          a=$(cat .vault-addr)
          grep -q "$a" README.md || { echo "::error::README does not carry $a"; exit 1; }
          short="${a:0:10}…${a: -4}"
          for f in web/index.html web/dashboard.html; do
            grep -q "$short" "$f" || { echo "::error::$f does not carry $short"; exit 1; }
          done
          echo "ok  $a"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: The offline self-checks
        # Two libraries decide what the vault quotes and what it thinks a window is worth.
        # Both carry an offline `--self-check`, and until now nothing ran either of them:
        # `fairvalue.ts` had one since August that was mentioned only in an evidence file,
        # and `quoting.ts` — the file that prices every order the vault has ever placed —
        # had no test of any kind. Neither touches the network, so a testnet outage cannot
        # make this step red.
        run: |
          node scripts/lib/fairvalue.ts --self-check
          node scripts/lib/quoting.ts --self-check

      - name: Build site
        run: npm run build

      - name: Assert the built pages are complete documents
        # The framework emits the document shell now, and this gate predates it: the pages
        # were once published as raw content and the live site sat in quirks mode with no
        # mobile viewport. Kept, because "the framework does that for you" is exactly the
        # assumption the regression was made of. Case-insensitive on charset: React writes
        # the attribute as `charSet`, which every HTML parser reads the same and a
        # case-sensitive grep does not.
        run: |
          for f in out/index.html out/deck.html; do
            head -c 15 "$f" | grep -qi '<!doctype html>' || { echo "::error::$f has no doctype"; exit 1; }
            grep -q '<html lang=' "$f" || { echo "::error::$f has no lang"; exit 1; }
            grep -qi 'name="viewport"' "$f" || { echo "::error::$f has no viewport"; exit 1; }
            grep -qi 'charset=' "$f" || { echo "::error::$f has no charset"; exit 1; }
            echo "ok  $f"
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser QA
        run: |
          node qa/serve.mjs &
          npx wait-on http://localhost:4321/ --timeout 30000
          BASE=http://localhost:4321 npx playwright test

      - name: Design detector (Impeccable)
        # 59 deterministic checks for the defaults AI-built interfaces reach for —
        # tracked-caps eyebrows, undersized UI text, layout transitions, neon-on-dark —
        # run against the rendered pages so contrast is measured on the real background.
        # Waivers live in .impeccable/config.json with their reason. Any finding fails.
        # /app is in the list because it is the page where money moves; being the one
        # page exempt from the design gate is exactly backwards.
        run: |
          npx --yes impeccable detect --no-advisory             http://localhost:4321/ http://localhost:4321/app http://localhost:4321/dashboard             http://localhost:4321/deck http://localhost:4321/404

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
