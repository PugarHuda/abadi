      - region "The arithmetic of a pair" [ref=e70]:
        - text: buy UP at p buy DOWN at p + s ← the venue quotes both sides Up-side, so this leg escrows 1 − (p + s)
        - generic [ref=e71]: pair costs 1 − s · pair is worth 1 · the difference is s, the spread
      - paragraph [ref=e72]: No inventory is needed to start. DreamDEX runs one order book, and a Buy Up crossing a Buy Down needs no seller at all — the pool mints a fresh pair out of the two buyers' collateral. So the vault can quote both sides holding nothing, and the spread it earns is the venue's own 2.9%, not a view about which way the price goes.
