        - text: What this is not
        - generic [ref=e122]: yet
      - paragraph [ref=e123]: A handful of fills proves the mechanism, not an edge. The real risk a maker carries is adverse selection — being filled on one side while the market walks away from the other. It happened to us twice in one afternoon. When it does, the vault is holding a direction, and NAV marks that leg at zero rather than at what it cost, so the loss lands on the people already in and not on whoever deposits next.
      - paragraph [ref=e124]: Measuring how often it happens needs many quotes across many windows. That is the next thing, not a thing we are claiming. The dashboard has the working, including what went wrong and what it cost.
