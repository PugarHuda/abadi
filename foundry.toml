[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.30"  # @somnia-chain/reactivity-contracts pins `pragma solidity 0.8.30` exactly
optimizer = true
optimizer_runs = 200
# The module's `markets()` returns a 14-field tuple; destructuring it blows the stack
# on the legacy pipeline. via_ir is the documented fix, not a workaround.
via_ir = true
# forge's default for 0.8.30 is osaka. The Shannon explorer's verifier lists osaka and
# then fails to reproduce it: an identical probe verified on cancun and not on osaka
# (2026-08-28, docs/evidence/verification-2026-08-28.md). Nothing here needs an opcode
# newer than cancun, and a judge who clicks the address should see source, not bytecode.
evm_version = "cancun"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
# 48 x 96 was 4,608 calls. The handler now also fills legs PARTIALLY, which is what makes
# `_legEscrow`'s only non-trivial branch reachable at all, and that widens the reachable
# state space rather than just reordering it: a leg can now sit at any fraction of its
# size instead of at 0 or 1. 96 x 160 is 15,360 calls and finds a run with eight partial
# fills in it; the suite still finishes in about twenty seconds.
runs = 96
depth = 160
# Every handler action wraps its own call in try/catch, so nothing here reverts to the
# fuzzer and `reverts: 0` was a number that could not have been anything else. Left ON
# rather than off: with the handler total by construction, a revert reaching this level
# means a handler action has stopped being total -- a `bound()` outside its range, a
# helper that forgot its catch -- and that should fail the run rather than be silently
# discarded from the sequence.
fail_on_revert = true
