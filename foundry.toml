[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.30"  # @somnia-chain/reactivity-contracts pins `pragma solidity 0.8.30` exactly
optimizer = true
optimizer_runs = 200
# The module's `markets()` returns a 14-field tuple; destructuring it blows the stack
# on the legacy pipeline. via_ir is the documented fix, not a workaround.
via_ir = true

[profile.default.fuzz]
runs = 256
